name: build-and-push-server-image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: server
          push: true
          tags: |
            ghcr.io/web-xiaxia/agents-anywhere-server:latest
            ghcr.io/web-xiaxia/agents-anywhere-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public (best effort)
        continue-on-error: true
        run: |
          gh api --method PUT /user/packages/container/agents-anywhere-server/visibility \
            -f visibility=public --silent && echo "package visibility set to public"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
